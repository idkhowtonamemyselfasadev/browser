name: Qt WebEngine for the checks
description: >
  Python plus PyQt6 WebEngine and the system libraries Chromium needs on a
  clean Ubuntu runner. Kept in one place so both workflows install exactly
  the same thing.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: System libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        # one at a time and tolerant: package names drift between Ubuntu
        # releases (libasound2 became libasound2t64), and a runner image
        # that already carries one of these must not fail the job
        for pkg in xvfb libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 \
                   libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
                   libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 \
                   libxdamage1 libxrandr2 libxtst6 libxi6 libdrm2 \
                   libasound2t64 libasound2 libfontconfig1 libdbus-1-3; do
          sudo apt-get install -y --no-install-recommends "$pkg" \
            || echo "note: $pkg is not available here, carrying on"
        done

    - name: Python packages
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --quiet \
          -r .github/requirements.txt
        python -c "from PyQt6.QtWebEngineCore import qWebEngineChromiumVersion as v; print('Chromium', v())"
